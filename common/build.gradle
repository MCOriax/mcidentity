plugins {
    id 'java'
    id 'maven-publish'
}

group = project.property('project-group')
version = "${project.property('project-version')}-${project.property('project-iteration')}"

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':api')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = "${rootProject.name}-common"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = project.name
                description = "MCOriax Plugin Common"
                url = "https://mcoriax.gitlab.io/website"
                developers {
                    developer {
                        id = "jetsadawijit"
                        name = "jetsadawijit"
                        url = "https://jetsadawijit.gitlab.io"
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitLab"
            url = "https://gitlab.com/api/v4/projects/${project.property('git-repository-id')}/packages/maven"
            credentials(HttpHeaderCredentials) {
                name = "Job-Token"
                value = System.getenv("CI_JOB_TOKEN")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}
