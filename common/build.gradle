import org.gradle.api.tasks.PathSensitivity

dependencies {
    compileOnly project(':api')
    compileOnly 'com.google.code.gson:gson:2.13.1'
    compileOnly 'org.mongodb:mongodb-driver-sync:5.7.0'

    testImplementation project(':api')
    testImplementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.mongodb:mongodb-driver-sync:5.7.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test {
    useJUnitPlatform()

    // ArchitectureBoundaryTest reads the platform modules' sources to prove they
    // only reach storage through MCIdentityProvider. Those files are not on this
    // module's compile classpath, so they have to be declared as task inputs —
    // otherwise Gradle considers the test up to date and a newly introduced
    // violation would slip through un-run.
    inputs.files(
        fileTree("${rootDir}/bukkit/src/main/java") { include '**/*.java' },
        fileTree("${rootDir}/platforms") { include '*/src/main/java/**/*.java' }
    ).withPropertyName('platformSources').withPathSensitivity(PathSensitivity.RELATIVE)
}

base {
    archivesName = "${rootProject.name}-common"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = "${rootProject.name}-${project.name}"
                description = "MCOriax Plugin Common"
            }
        }
    }
}
