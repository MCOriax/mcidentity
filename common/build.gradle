dependencies {
    implementation project(':api')
    implementation 'com.zaxxer:HikariCP:7.0.2'
}

base {
    archivesName = "${rootProject.name}-common"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = project.name
                description = "MCOriax Plugin Common"
            }
        }
    }
}
