pluginManagement {
    repositories {
        gradlePluginPortal()
        // The MCEngine convention plugin applied by the root build.gradle.
        maven {
            name = 'MCEngineGradlePlugin'
            url = 'https://maven.pkg.github.com/MCEngine/gradle-plugin'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mcidentity'

include 'api'
include 'common'
include 'tools'
include 'bukkit'
include 'platforms:foliamc'
include 'platforms:papermc'
include 'platforms:spigotmc'
include 'platforms:engine'
