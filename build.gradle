// The shared build logic — group and version from gradle.properties, Maven
// Central, the Java 25 toolchain, UTF-8, GitHub Packages publishing and Shadow —
// comes from the MCEngine convention plugin. Only what differs from its defaults
// is set here. See https://github.com/MCEngine/gradle-plugin
plugins {
    id 'io.github.mcengine.build-logic' version '0.1.0'
}

mcengineBuild {
    pomUrl = 'https://mcoriax.github.io/website'
}
