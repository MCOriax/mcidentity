allprojects {
    group = project.property('project-group')
    version = "${project.property('project-version')}-${project.property('project-iteration')}"

    repositories {
        mavenCentral()
    }
}

subprojects {
    // Skip projects that don't have their own build.gradle file (e.g., the 'platforms' intermediate folder)
    if (!file('build.gradle').exists()) {
        return
    }

    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Emit Java 17 bytecode (class major version 61) regardless of the JDK used to
    // build. Minecraft servers run an older bundled ASM in their plugin rewriter
    // (Paper's "Commodore"); Java 25 bytecode (major 69) makes it fail to load the
    // plugin with "Unsupported class file major version 69". Java 17 is the lowest
    // target the codebase's language features (records, pattern matching) allow and
    // runs on every supported modern server (MC 1.18+ / Java 17+).
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/${project.property('git-org-name')}/${project.property('git-repository')}"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
        
        publications.withType(MavenPublication) {
            pom {
                url = "https://mcoriax.github.io/website"
                developers {
                    developer {
                        id = "jetsadawijit"
                        name = "jetsadawijit"
                        url = "https://jetsadawijit.github.io"
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
