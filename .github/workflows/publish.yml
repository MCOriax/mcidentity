name: Publish

# Publishes the library modules to GitHub Packages and tags the commit when a release lands on master. The steps live in the shared
# MCEngine/actions workflow: it reads project-version from gradle.properties,
# stops when the v{version} tag already exists, and otherwise builds, tests,
# publishes and only then tags, so a failed run leaves no tag behind.
#
# workflow_dispatch runs the same check by hand, to retry a release after a
# failure.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    uses: MCEngine/actions/.github/workflows/publish.yml@master
    secrets: inherit
