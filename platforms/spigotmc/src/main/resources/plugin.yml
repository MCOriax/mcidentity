name: ${name}
version: ${version}
main: io.github.mcoriax.mcidentity.spigotmc.MCIdentityPlugin
commands:
  identity:
    description: Main command for Identity system
    usage: /identity <subcommand>
api-version: '1.20'
author: MCOriax
description: A plugin for SpigotMC

libraries:
  - com.google.code.gson:gson:2.13.1
  - org.postgresql:postgresql:42.7.11
  - org.mongodb:mongodb-driver-sync:5.7.0

permissions:
  mcidentity.admin:
    description: Allows administrative identity commands (identity get, base add)
    default: op
