enable: false

license: "free"

# The cooldown for swapping identities in minutes (0 to disable)
identity_swap_cooldown: 0

# Whether a player's equipped identity key drops on death. When false (the
# default) the identity is kept and the player keeps wearing it after respawn;
# when true the identity key drops and the player falls back to the base
# "player" profession.
drop_on_death: false

# Identity data storage backend.
# type: sqlite (default, zero configuration local file), mysql, postgresql,
# mongodb, or central (the MCIdentity central REST server configured below).
database:
  type: sqlite
  sqlite:
    # File name inside the plugin data folder
    file: "mcidentity.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "mcidentity"
    username: "root"
    password: "password"
  postgresql:
    host: "localhost"
    port: 5432
    database: "mcidentity"
    username: "postgres"
    password: "password"
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "mcidentity"

# Central server owning all identity data, used when database.type is
# "central". Every game server on the network points at the same deployment.
central_server:
  # Base URL of the central server (no trailing slash)
  url: "https://server.com"
  # Bearer token matching the central server SERVER_API_TOKEN value
  token: ""
  # HTTP request timeout in seconds
  timeout_seconds: 10

# -----------------------------------------------------------------------------
#  AI agent
# -----------------------------------------------------------------------------
#  The OpenRouter API key and models this plugin's agent work runs on.
#
#  'token' is the OpenRouter API key; the other nine keys name the model for
#  each modality: text, image, video, speech, decisions, embeddings, rerank,
#  transcription and audio.
#
#  'global' uses the value MCAgents is configured with — the same key under
#  'agents' in plugins/MCAgents/config.yml — read at runtime, so the whole
#  server shares one key and one model per modality. 'token' may instead hold
#  an OpenRouter API key of this plugin's own, and any modality an OpenRouter
#  model id such as 'openrouter/free'. A 'model' key left over from an older
#  config.yml is read as the text model.
# -----------------------------------------------------------------------------
agents:
  token: global
  text: global
  image: global
  video: global
  speech: global
  decisions: global
  embeddings: global
  rerank: global
  transcription: global
  audio: global
