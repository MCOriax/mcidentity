name: ${name}
version: ${version}
main: io.github.mcoriax.mcidentity.foliamc.MCIdentityPlugin
commands:
  identity:
    description: Wear a profession and view your stats
    usage: /identity <subcommand>
api-version: '1.20'
folia-supported: true
softdepend:
  - MCAgents
author: MCOriax
description: A plugin for Folia

libraries:
  - com.google.code.gson:gson:2.13.1
  - org.postgresql:postgresql:42.7.11
  - org.mongodb:mongodb-driver-sync:5.7.0

permissions:
  mcoriax.mcidentity.tool.*:
    description: Every MCIdentity AI tool every player may use. MCAgents only offers a player the tools they are OP for or hold the node of.
    default: true
    children:
      mcoriax.mcidentity.tool.mcidentity_get_my_identity: true
      mcoriax.mcidentity.tool.mcidentity_get_my_stats: true
  mcoriax.mcidentity.tool.mcidentity_get_my_identity:
    description: Let the AI read the profession you wear.
    default: true
  mcoriax.mcidentity.tool.mcidentity_get_my_stats:
    description: Let the AI read your stats.
    default: true
  mcoriax.mcidentity.*:
    description: Grants every identity command and every profession
    default: op
    children:
      mcoriax.mcidentity.tool.*: true
      mcoriax.mcidentity.command.use: true
      mcoriax.mcidentity.command.help: true
      mcoriax.mcidentity.command.wiki: true
      mcoriax.mcidentity.command.check: true
      mcoriax.mcidentity.command.stats: true
      mcoriax.mcidentity.command.wear: true
      mcoriax.mcidentity.command.unwear: true
      mcoriax.mcidentity.profession.*: true

  mcoriax.mcidentity.profession.*:
    description: Wear every profession. Revoke it and grant mcoriax.mcidentity.profession.<code> to limit which professions a player may wear
    default: true

  mcoriax.mcidentity.command.use:
    description: Open the main Identity menu with /identity
    default: true

  mcoriax.mcidentity.command.help:
    description: Show the /identity help listing
    default: true

  mcoriax.mcidentity.command.wiki:
    description: Get clickable links to the documentation
    default: true

  mcoriax.mcidentity.command.check:
    description: Show the worn profession, its level, and your stats
    default: true

  mcoriax.mcidentity.command.stats:
    description: View and upgrade your stats
    default: true

  mcoriax.mcidentity.command.wear:
    description: Wear a profession with /identity wear
    default: true

  mcoriax.mcidentity.command.unwear:
    description: Take off the worn profession with /identity unwear
    default: true
