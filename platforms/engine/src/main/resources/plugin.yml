name: ${name}
version: ${version}
main: io.github.mcoriax.mcidentity.engine.MCIdentityEnginePlugin
commands:
  identity:
    description: Main command for Identity system
    usage: /identity <subcommand>
api-version: '1.20'
folia-supported: true
softdepend:
  - MCAgents
author: MCOriax
description: A universal plugin for SpigotMC, PaperMC, and Folia

libraries:
  - com.google.code.gson:gson:2.13.1
  - org.postgresql:postgresql:42.7.11
  - org.mongodb:mongodb-driver-sync:5.7.0

permissions:
  mcoriax.mcidentity.*:
    description: Grants every identity command, player and administrative alike
    default: op
    children:
      mcoriax.mcidentity.command.use: true
      mcoriax.mcidentity.command.help: true
      mcoriax.mcidentity.command.wiki: true
      mcoriax.mcidentity.command.check: true
      mcoriax.mcidentity.command.unequip: true
      mcoriax.mcidentity.command.stats: true
      mcoriax.mcidentity.command.alias: true
      mcoriax.mcidentity.command.get: true
      mcoriax.mcidentity.command.base: true
      mcoriax.mcidentity.admin: true

  mcoriax.mcidentity.admin:
    description: Grants every administrative identity command
    default: op
    children:
      mcoriax.mcidentity.command.get: true
      mcoriax.mcidentity.command.base: true

  mcidentity.admin:
    description: Legacy node from before the mcoriax prefix; grants every administrative identity command
    default: op
    children:
      mcoriax.mcidentity.admin: true

  mcoriax.mcidentity.command.use:
    description: Open the main Identity menu with /identity
    default: true

  mcoriax.mcidentity.command.help:
    description: Show the /identity help listing
    default: true

  mcoriax.mcidentity.command.wiki:
    description: Get clickable links to the documentation
    default: true

  mcoriax.mcidentity.command.check:
    description: Inspect the identity key in hand or equipped
    default: true

  mcoriax.mcidentity.command.unequip:
    description: Unequip the current active identity
    default: true

  mcoriax.mcidentity.command.stats:
    description: View and upgrade identity stats
    default: true

  mcoriax.mcidentity.command.alias:
    description: Show or claim the alias of the active identity
    default: true

  mcoriax.mcidentity.command.get:
    description: Give an identity key item with /identity get
    default: op

  mcoriax.mcidentity.command.base:
    description: Grant alternative base identity slots with /identity base
    default: op
