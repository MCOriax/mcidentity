name: ${name}
version: ${version}
main: io.github.mcoriax.papermc.MCIdentityPlugin
commands:
  identity:
    description: Main command for Identity system
    usage: /identity <subcommand>
api-version: '1.20'
author: MCOriax
description: A plugin for PaperMC

libraries:
  - com.google.code.gson:gson:2.13.1

permissions:
  mcidentity.admin:
    description: Allows administrative identity commands (identity get, ability get, rune get)
    default: op
