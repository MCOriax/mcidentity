plugins {
    id 'com.gradleup.shadow' version '9.4.1'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // The shared modules are shaded once by the universal engine jar, which is
    // the only distributed artifact. This module is bundled into that jar, so it
    // declares them compileOnly and ships only its own classes — never api,
    // common, or bukkit — avoiding duplicate copies in the final jar.
    compileOnly project(':api')
    compileOnly project(':common')
    compileOnly project(':bukkit')

    // Database drivers not bundled by the server itself. Declared compileOnly
    // and downloaded at runtime via the plugin.yml `libraries` section instead
    // of being shaded into the plugin jar. The SQLite and MySQL drivers ship
    // with Spigot and Paper, so only these two are downloaded.
    compileOnly 'org.postgresql:postgresql:42.7.11'
    compileOnly 'org.mongodb:mongodb-driver-sync:5.7.0'

    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'

    // compileOnly is not inherited by the test classpath; bukkit (which
    // re-exposes api and common) is added back for tests explicitly.
    testImplementation project(':bukkit')
    testImplementation 'io.papermc.paper:paper-api:26.3.build.+'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    
    // Ensure all implementation dependencies are shadowed
    configurations = [project.configurations.runtimeClasspath]
}

processResources {
    def props = [
        version: project.version,
        group: project.group,
        name: 'MCIdentity'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

base {
    archivesName = "MCIdentityPaperMC"
}

build.dependsOn shadowJar
