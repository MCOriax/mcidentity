plugins {
    id 'java-library'
}

repositories {
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    api project(':api')
    api project(':common')

    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'

    // spigot-api declares the JetBrains annotations as provided, so they are not on
    // the compile classpath through it; the event and command classes use them.
    compileOnly 'org.jetbrains:annotations:26.1.0'
}

base {
    archivesName = "${rootProject.name}-bukkit"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "${rootProject.name}-${project.name}"
                description = "MCOriax Plugin Bukkit"
            }
        }
    }
}
