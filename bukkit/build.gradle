import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'java-library'
}

repositories {
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    api project(':api')
    api project(':common')

    // The MCAgents tool definitions. compileOnly so the published bukkit
    // library does not drag an unpublished module into its consumers; the
    // engine bundles the classes instead.
    compileOnly project(':tools')

    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'

    // spigot-api declares the JetBrains annotations as provided, so they are not on
    // the compile classpath through it; the event and command classes use them.
    compileOnly 'org.jetbrains:annotations:26.1.0'

    testImplementation 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // PermissionsTest reads the four platform plugin.yml files, which are not on
    // this module's classpath; declaring them as inputs keeps the test from going
    // up to date when only a plugin.yml changed.
    inputs.files(
        fileTree("${rootDir}/platforms") { include '*/src/main/resources/plugin.yml' }
    ).withPropertyName('pluginDescriptors').withPathSensitivity(PathSensitivity.RELATIVE)
}

base {
    archivesName = "${rootProject.name}-bukkit"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "${rootProject.name}-${project.name}"
                description = "MCOriax Plugin Bukkit"
            }
        }
    }
}
