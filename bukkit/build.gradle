plugins {
    id 'java-library'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    api project(':api')
    api project(':common')

    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
}

base {
    archivesName = "${rootProject.name}-bukkit"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            
            pom {
                name = project.name
                description = "MCOriax Plugin Bukkit"
            }
        }
    }
}
