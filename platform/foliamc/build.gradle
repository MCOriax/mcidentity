plugins {
    id 'com.gradleup.shadow' version '8.3.6'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    implementation project(':api')
    implementation project(':common')
    implementation project(':bukkit')
    implementation 'org.xerial:sqlite-jdbc:3.53.0.0'
    implementation 'io.github.mcengine:mcextension:2026.0.6-1'
    
    compileOnly 'dev.folia:folia-api:1.20.1-R0.1-SNAPSHOT'
}

shadowJar {
    archiveClassifier.set('')
}

processResources {
    def props = [
        version: project.version,
        group: project.group,
        name: 'MCIdentity'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

base {
    archivesName = "${rootProject.name}-foliamc"
}

publishing {
    publications {
        shadow(MavenPublication) {
            from components.java
            artifact shadowJar
            
            pom {
                name = project.name
                description = "MCOriax Plugin FoliaMC"
            }
        }
    }
}

build.dependsOn shadowJar

tasks.register('exportJar') {
    dependsOn shadowJar
    doLast {
        def exportPath = System.getenv("FOLIAMC_PLUGIN_JAR_PATH")
        if (exportPath != null && !exportPath.isEmpty()) {
            def destDir = file(exportPath)
            if (destDir.exists() && destDir.isDirectory()) {
                // Delete existing jars starting with rootProject.name
                destDir.listFiles().each { file ->
                    if (file.name.startsWith(rootProject.name) && file.name.endsWith(".jar")) {
                        println "Deleting existing plugin jar: ${file.name}"
                        file.delete()
                    }
                }
                
                // Copy the new jar
                copy {
                    from shadowJar.archiveFile
                    into destDir
                }
                println "Exported ${shadowJar.archiveFileName.get()} to ${exportPath}"
            } else {
                println "Export path does not exist or is not a directory: ${exportPath}"
            }
        }
    }
}

build.finalizedBy exportJar
