enable: false

license: "free"

# The cooldown for swapping identities in minutes (0 to disable)
identity_swap_cooldown: 0

# Identity specific storage settings
features:
  inventory: false
  enderchest: false

database:
  type: "sqlite"
  sqlite:
    file: "mcidentity.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "mcidentity"
    username: "postgres"
    password: "password"
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "mcidentity"
